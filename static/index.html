<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local Multivideo Composer</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><strong>Multivideo Composer</strong><span>Local · FFmpeg</span><div class="push"></div><button id="save">Save project</button><label class="button">Load project<input type="file" id="load" accept="application/json" hidden></label></header>
<main><section class="panel"><div class="bar"><label class="button primary">+ Add videos<input id="files" type="file" accept="video/*" multiple hidden></label><span id="message">Ready</span><div class="push"></div><label>Canvas <select id="preset"><option value="1280x720">1280×720</option><option value="1920x1080">1920×1080</option><option value="1080x1080">1080×1080</option></select></label><label>FPS <input type="number" id="fps" value="30" min="1" max="120" style="width:55px"></label></div>
<div id="stageWrap"><div id="stage"></div></div>
<div class="bar controls"><button id="play">▶ Play</button><button id="back">◀ Frame</button><button id="next">Frame ▶</button><label>Speed <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option></select></label><div class="push"></div><span id="clock">00:00.000 / 00:00.000</span></div>
<input type="range" id="scrub" min="0" max="1" value="0" step="0.001">
</section>
<aside class="panel"><h3>Selected video</h3><p class="muted">Click a video on the canvas or its timeline track.</p><div id="inspector"><p class="muted">No selection</p></div><hr><h3>Export</h3><label>Format <select id="format"><option value="mp4">MP4 (H.264)</option><option value="webm">WebM (VP9)</option><option value="mov">MOV (H.264)</option><option value="gif">Animated GIF</option><option value="png">PNG (current frame)</option><option value="jpg">JPEG (current frame)</option></select></label><button class="primary" id="export">Render export</button><p id="exportStatus" class="muted">Exports are saved to workspace/exports.</p></aside>
<section class="panel timeline"><div class="bar"><h3>Timeline</h3><span class="muted">Drag tracks horizontally to align · click ruler to seek</span><div class="push"></div><label>Pixels/second <input type="range" id="zoom" min="4" max="80" value="18"></label></div><div id="timelineScroll"><div id="ruler"></div><div id="tracks"></div></div></section>
</main><script src="/static/app.js"></script></body></html>
